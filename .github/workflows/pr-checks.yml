name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom/@testing-library/undici (deps de teste) exigem Node >=22 —
          # o app em si (Next.js/Prisma) roda em Node 20 normalmente, mas o
          # ambiente de CI aqui é só pra rodar os testes.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Instala dependências
        working-directory: app
        run: npm ci

      - name: Roda unit tests com verificação de cobertura
        working-directory: app
        run: npm run test:coverage

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Instala dependências do Playwright
        working-directory: e2e
        run: npm ci

      - name: Instala o browser do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # O webServer do playwright.config.ts já sobe a stack via
      # docker-compose (build a partir do código deste PR + seed
      # determinístico, ver e2e/seed.mjs) antes de rodar os testes.
      - name: Roda os testes E2E
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - name: Sobe artefatos do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Derruba a stack de E2E
        if: always()
        run: |
          docker compose -p optcgdir-e2e -f docker-compose.yml -f docker-compose.e2e.yml --env-file .env.e2e down -v
